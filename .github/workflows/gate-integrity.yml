name: gate-integrity

# The seatbelt: a PR that modifies a workflow, REMOVES an assertion from the
# fixture suite, or deletes a hook/script fixture must carry the
# `machinery-change` label. Adding assertions is allowed unlabelled — that is
# the normal case for any PR that adds a skill, hook, agent, or script, and
# blocking it made the gate fire on good work. The rule engine lives in
# scripts/check-machinery-gate.sh so it can be fixture-tested.
#
# The label remains the declared escape hatch, and it is operator-controlled:
# CODEOWNERS routes /.github/ and /scripts/ to the operator, so waiving the
# gate is always a deliberate human act.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: gate-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seatbelt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check machinery paths against the machinery-change label
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case ",$LABELS," in
            *,machinery-change,*)
              echo "machinery-change label present — gate waived by the operator"
              exit 0 ;;
          esac
          git fetch --quiet origin "$BASE_REF"
          exec ./scripts/check-machinery-gate.sh "origin/$BASE_REF"
