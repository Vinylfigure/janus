name: gate-integrity

# Runs only the trusted default-branch policy. Candidate code never executes.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to recheck after a native review
        required: true
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
concurrency:
  group: gate-integrity-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: true
jobs:
  seatbelt:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-policy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Classify effects and verify current human authorization
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_REPO: ${{ github.repository }}
          POLICY_PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          POLICY_OPERATOR_IDS: ${{ vars.POLICY_OPERATOR_IDS }}
        run: |
          case "$POLICY_PR" in ''|*[!0-9]*) exit 1 ;; esac
          POLICY_HEAD=$(gh api "repos/$POLICY_REPO/pulls/$POLICY_PR" --jq .head.sha)
          POLICY_RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api --method POST "repos/$POLICY_REPO/statuses/$POLICY_HEAD" -f state=pending -f context=effect-policy -f description="Checking the current change and authorization" -f target_url="$POLICY_RUN_URL"
          POLICY_STATE=failure
          if node trusted-policy/scripts/effect-policy-cli.mjs --repo="$POLICY_REPO" --pr="$POLICY_PR" --head="$POLICY_HEAD"; then
            POLICY_STATE=success
          fi
          gh api --method POST "repos/$POLICY_REPO/statuses/$POLICY_HEAD" -f state="$POLICY_STATE" -f context=effect-policy -f description="Current revision effect policy evaluated" -f target_url="$POLICY_RUN_URL"
          test "$POLICY_STATE" = success
