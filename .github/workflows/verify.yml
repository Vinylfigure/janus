name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hook-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Same entry point a developer runs. Reaching past verify.sh to call one
      # of its legs directly keeps CI passing while its green certifies less:
      # this job ran ./scripts/test-hooks.sh until 2026-08-22, so check-loops,
      # check-ledger-aging and the AGENTS.md drift gate never ran in CI at all.
      - name: Run the verification loop
        run: |
          git config user.email "ci@janus.local"
          git config user.name "janus-ci"
          ./scripts/verify.sh full
