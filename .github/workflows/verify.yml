name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hook-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run hook fixture tests
        run: |
          git config user.email "ci@janus.local"
          git config user.name "janus-ci"
          ./scripts/test-hooks.sh
