name: Claude

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# Two @claude events on one issue never run simultaneously. This is a collision
# control, not a dedup control — a duplicate event still queues and runs after
# the first finishes. Dedup is handled one layer up by the
# `overlord-work-order:` body-line check at dispatch time.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # The `@claude` mention states intent; it authorizes nothing. This repo is
    # public, so without an actor gate any GitHub user could wake a job holding
    # `contents: write` and the operator's subscription credential. Each event
    # is checked against the author of the thing carrying the mention -- never
    # against the issue author, which a stranger's comment on the operator's
    # own issue would otherwise satisfy. `overlord-ui-joe[bot]` stays allowed:
    # the operator's own deployment answers here and its comments carry no
    # collaborator association of their own.
    if: |
      (github.event_name == 'issues' &&
        (github.actor == 'overlord-ui-joe[bot]' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' &&
        (github.actor == 'overlord-ui-joe[bot]' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        (github.actor == 'overlord-ui-joe[bot]' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
        (github.actor == 'overlord-ui-joe[bot]' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) &&
        contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    # The primary cost bound. A stuck agent otherwise runs to GitHub's 6-hour
    # default, burning the shared subscription quota that also feeds live
    # sessions.
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # Floating major includes the >= v1.0.94 bot-trigger security fix
      # (CVE-2025-66032). Dispatch issues are NOT bot-authored — the overlord
      # writes as `Vinylfigure` (type User) via the connector app; only this
      # repo's own comments are `claude[bot]`. The pin is ordinary dependency
      # hygiene, not a response to bot-authored dispatch.
      # `allowed_bots` names the ONE bot allowed to wake this workflow: the
      # operator's own overlord-ui deployment writes as `overlord-ui-joe[bot]`
      # — an answer to a question, a decision on a PR ask, a Resolve tap on a
      # conflict — and claude-code-action refuses every bot actor not listed
      # (overlord run 34811438736: "Workflow initiated by non-human actor:
      # overlord-ui-joe (type: Bot)"). Every other bot, `claude[bot]`'s own
      # echoes included, stays refused, so this is still no echo-retrigger.
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: overlord-ui-joe[bot]
          # --max-turns is the runaway bound, not the effort budget; per-order
          # effort budgets live in the work-order spec. Raised 120 -> 150
          # 2026-09-01: a run that finished successfully at turn 121 was
          # marked failed by the action (overlord run 33436707198). --model
          # sonnet makes the dispatch bus's implicit pin explicit as a
          # downward alias (overlord docs/MODEL-TIERS.md, "The dispatch bus
          # is an implicit pin") — omitting --model silently took the
          # action's default (observed claude-sonnet-5); this states that
          # default instead of leaving it to drift with the action's own
          # defaults. This is the template every child inherits, so the fix
          # belongs here, not just in overlord.
          #
          # SYNTAX, and the reason this was rewritten: the wildcard in a tool
          # grant is `:*`, a literal prefix wildcard — NOT a shell glob. The
          # previous grant said Bash(git *),Bash(gh *),Bash(scripts/*), which
          # matches only commands whose text is exactly `git *`, `gh *` or
          # `scripts/*`, i.e. nothing at all (L-052). This repo could accept an
          # @claude order and then run no shell command, so a dispatched run
          # could claim a verification loop but never close one — the
          # aegis-sentinel#1 failure the comment below warns about, arriving
          # through syntax instead of omission. janus is the template every
          # child inherits, so the defect propagated: overlord-ui carried it
          # verbatim. Every dispatch-proven repo uses the :* form.
          #
          # --allowedTools: post-bootstrap tier — this repo's stack is the
          # scaffold itself, so the grant mirrors .github/loops.yaml's declared
          # allowed_tools exactly (the manifest and the channel must agree, or
          # the dashboard's reconciliation reads a grant that isn't real).
          # Without a Bash grant the action can run no shell command at all,
          # so a dispatched order could only claim a verification loop, never
          # close one (aegis-sentinel#1).
          #
          # `gh issue close` is stated on its own line even though
          # `Bash(gh issue:*)` already prefixes it: the close verb is the one
          # the work loop was missing, and a grant that only implies it reads
          # as absent to anyone auditing the channel. A firing that delivered
          # a plain `task:` by merged PR closes THAT issue and nothing else
          # (.claude/skills/work-loop/SKILL.md, step 2b) — a comment beginning
          # "Closing:" on an issue that then stays open is the failure it
          # ends. `check-ask.sh` is the recorded-ask gate the same skill runs
          # before it posts an ask (docs/ATTENTION.md).
          claude_args: --model sonnet --max-turns 150 --allowedTools "Read,Glob,Grep,Edit,Write,Bash(./scripts/verify.sh:*),Bash(scripts/verify.sh:*),Bash(bash scripts/verify.sh:*),Bash(./scripts/test-hooks.sh:*),Bash(scripts/test-hooks.sh:*),Bash(bash scripts/test-hooks.sh:*),Bash(./scripts/check-loops.sh:*),Bash(scripts/check-loops.sh:*),Bash(./scripts/check-ready.sh:*),Bash(scripts/check-ready.sh:*),Bash(./scripts/check-record.sh:*),Bash(scripts/check-record.sh:*),Bash(./scripts/check-ask.sh:*),Bash(scripts/check-ask.sh:*),Bash(./scripts/request-human-check.sh:*),Bash(scripts/request-human-check.sh:*),Bash(./scripts/generate-agents-md.sh:*),Bash(scripts/generate-agents-md.sh:*),Bash(./scripts/check-ledger-aging.sh:*),Bash(scripts/check-ledger-aging.sh:*),Bash(bash -n:*),Bash(git status:*),Bash(git diff:*),Bash(git add:*),Bash(git checkout:*),Bash(git branch:*),Bash(git commit:*),Bash(git push:*),Bash(git log:*),Bash(gh pr:*),Bash(gh issue:*),Bash(gh issue close:*)"
