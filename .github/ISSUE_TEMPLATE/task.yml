name: Task
description: A unit of ready work for the work loop — carries its own done-means.
title: "task: "
labels: ["task:"]
body:
  - type: textarea
    id: done-means
    attributes:
      label: Done means
      description: The runnable or observable check that closes this issue. The work loop only takes tasks it can verify finished — a task without a done-means is not ready.
      placeholder: "`scripts/verify.sh full` exits 0 with the new fixture; the dashboard shows X"
    validations:
      required: true
  - type: textarea
    id: discovered-from
    attributes:
      label: Discovered from
      description: Provenance — the PR, plan section, audit line, or idle evaluation this was descoped from (descope capture, L-043).
      placeholder: "discovered-from: PR #12 review, deferred part B"
    validations:
      required: false
  - type: textarea
    id: human-check
    attributes:
      label: Human check
      description: Only when machine verification cannot judge the outcome — what the operator must verify with their own eyes before this counts as done. Delivery then applies `human-check:` to this issue and the PR waits for that check before merge (Human Attention Protocol v1, docs/ATTENTION.md).
      placeholder: |
        Surface: preview deployment
        Instruction: Save a nanny, refresh, remove one.
        URL: https://...
        Pass: the saved state survives the refresh
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: The work loop takes the oldest ready task unless one is marked high.
      options:
        - normal
        - high
        - low
      default: 0
    validations:
      required: false
