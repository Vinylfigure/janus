name: Question (operator decision)
description: A decision only the operator can make — blocks every task whose "Blocked by" field references it.
title: "question: "
labels: ["question:", "janus:v1"]
body:
  - type: textarea
    id: in-plain-words
    attributes:
      label: In plain words
      description: One sentence, in the operator's own words, restating what is being asked — no ids, file paths, backticks, or protocol nouns, 160 characters or fewer. A control surface renders this as the card headline; without it the card shows muted, "not yet in plain words".
      placeholder: "Should low-stakes questions answer themselves after three days of silence?"
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision
      description: State the decision needed, then the options already considered as bullets with one-line trade-offs — a question without options is an unfinished exploration, not a decision request. The aging ladder escalates this issue (`aging` >3d, `overdue` >7d) until the operator replies; the reply clears the labels. These headings are the v1 machine interface (docs/ATTENTION.md) — do not rename them.
      placeholder: |
        Should X or Y own Z?
        - X: pro..., con...
        - Y: pro..., con...
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: 2-4 named answers, one per line, in the operator's own words — these become the card's buttons.
      placeholder: |
        Yes, auto-answer after three days
        No, always wait for me
    validations:
      required: true
  - type: textarea
    id: recommended-choice
    attributes:
      label: Recommended choice
      description: The option this repo would pick if the operator said "use your recommendation" — must be one of the Options, verbatim. Required — a question arrives with a recommendation.
      placeholder: "X, because..."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The rationale for the recommendation, in plain words.
    validations:
      required: true
  - type: textarea
    id: if-you-do-nothing
    attributes:
      label: If you do nothing
      description: The consequence of no answer — what stays blocked, what default takes effect, what risk accrues.
    validations:
      required: true
  - type: textarea
    id: reversible
    attributes:
      label: Reversible?
      description: Whether the recommended choice can be cheaply undone, and how.
      placeholder: "yes — one commit reverts it / no — schema migration"
    validations:
      required: false
  - type: textarea
    id: needed-by
    attributes:
      label: Needed by
      description: When an answer stops being useful (a date or an event), if there is one.
      placeholder: "2026-09-01, before the next release cut"
    validations:
      required: false
  - type: textarea
    id: blocks
    attributes:
      label: Blocks
      description: For the human reading this — the work waiting on the answer. The dependent task's own "Blocked by" field is what the executor checks.
      placeholder: "#45, #47"
    validations:
      required: false
  - type: textarea
    id: parent-goal
    attributes:
      label: Parent goal
      description: "The Goal this question gates, as `goal/<n>` (the Vinylfigure/overlord issue number — `goal/207` anywhere means Vinylfigure/overlord#207). Leave empty for questions not under a Goal."
      placeholder: "goal/207"
    validations:
      required: false
  - type: textarea
    id: gates-signal
    attributes:
      label: Gates signal
      description: The one success signal on the parent Goal that your answer makes evaluable, quoted verbatim from the Goal's `### Success signals`. One line.
    validations:
      required: false
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      description: "Decision: pick between named options. Permission: grant something outside delegated authority (a credential, a boundary change). Escalation: a mechanical blocker the machine may not clear alone."
      options:
        - Decision
        - Permission
        - Escalation
      default: 0
    validations:
      required: false
