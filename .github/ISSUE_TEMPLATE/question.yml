name: Question (operator decision)
description: A decision only the operator can make — blocks every task that references it.
labels: ["question:"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question and options considered
      description: State the decision needed, then the options already considered with one-line trade-offs — a question without options is an unfinished exploration, not a decision request. The aging ladder escalates this issue (`aging` >3d, `overdue` >7d) until the operator replies; the reply clears the labels.
      placeholder: |
        Question: should X or Y own Z?
        Options considered:
        - X: pro..., con...
        - Y: pro..., con...
    validations:
      required: true
